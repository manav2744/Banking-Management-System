<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking Management System</title>

    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="container">

    <div class="login-box">

        <h1>Banking Management System</h1>

        <p>Admin Login</p>

        <form id="loginForm">

            <input
            type="text"
            id="username"
            placeholder="Username"
            required>

            <input
            type="password"
            id="password"
            placeholder="Password"
            required>

            <button type="submit">
                Login
            </button>

        </form>

        <p id="error"></p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
